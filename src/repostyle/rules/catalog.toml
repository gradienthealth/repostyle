[RS062]
name = "test-module-size"
summary = "A test module stays within its configured physical code-line limit."
rationale = "A large test module can expose a production unit with too many responsibilities, or it can collect unrelated behavior in one place. Review the production boundary first. When that boundary is cohesive, split the tests by behavior into modules with names that state what each covers. Do not create numbered fragments or remove coverage merely to cross the threshold. The default limit is 500, configured with `max-test-file-lines` in `[tool.repostyle]`."
examples = []
signals = ["Tests span unrelated production responsibilities: split or simplify the production unit, then align test modules to those boundaries.", "The production boundary is cohesive but its behavior has distinct areas: organize tests into named modules around those areas.", "The module must stay intact for a documented reason: place `# style: ignore-file[RS062]` near the top with a short rationale."]
reference = []

[RS063]
name = "shared-test-helper"
summary = "Matching substantial helpers or compatible fixtures across test files are candidates for one shared definition."
rationale = "The rule compares conservative syntax, local binding relationships, and external dependency identities. A match is evidence of repeated test support code, not proof that the definitions share semantics or lifecycle. Place a shared helper in the narrowest support module its callers already own. Use a fixture when pytest should supply a value; use a builder or ordinary helper when each test should choose when and how to construct it."
examples = []
signals = ["Check mutable state, cleanup, fixture scope, and isolation before consolidating. Keep separate definitions when their contracts only happen to have the same current syntax.", "A line, block, or file suppression silences that occurrence. It can remain structural evidence for an unsuppressed peer; an `exclude` glob removes the file from both evidence and reporting.", "Dynamic namespace access, comprehensions, nested scopes, and other uncertain bindings are skipped rather than guessed. Unresolved names under wildcard imports stay file-specific and cannot create a cross-file match."]
reference = []

[RS064]
name = "test-parametrization-candidate"
summary = "Three tests with one named contract, the same supported structure, and differing scalar body literals are candidates for parametrization."
rationale = "Parametrization can state repeated behavior as one contract plus a table of cases. The rule preserves signatures, marks, decorators, call targets, operations, and literal types, requires at least two meaningful test-name words in common, and requires at least one literal position to vary. It keeps multi-line fixture programs distinct. It does not justify adding conditionals or combining cases with different behavior."
examples = [{ bad = "def test_Parse_AcceptsAlpha():\n    assert parse('a') == 1\n\ndef test_Parse_AcceptsBeta():\n    assert parse('b') == 2\n\ndef test_Parse_AcceptsGamma():\n    assert parse('c') == 3", good = "@pytest.mark.parametrize(\n    ('text', 'expected'), [('a', 1), ('b', 2), ('c', 3)]\n)\ndef test_Parse_AcceptsNamedCase(text, expected):\n    assert parse(text) == expected", note = "Give rows readable ids or names when the original test names carried behavior a failure report should retain." }]
signals = []
reference = []

[RS065]
name = "repeated-test-setup"
summary = "Three tests sharing a leading assignment sequence that includes a call are candidates for a builder or fixture."
rationale = "Repeated construction can obscure the behavior each test varies. The rule compares exact leading assignments, including values, call targets, and dependencies, then reports the longest shared prefix for each matching group. The repeated call may still be the action under test, so the warning does not label it setup."
examples = []
signals = ["Prefer a builder or ordinary helper when tests need fresh values or different construction timing. Choose a fixture only after checking scope, teardown, mutation, and isolation.", "This rule is independent of the parametrization rule. Both may report the same tests because consolidating setup and tabulating cases are separate review choices."]
reference = []

[RS066]
name = "source-module-size"
summary = "A Python source module stays within its configured physical code-line limit."
rationale = "A large source module can hide several responsibilities behind one import boundary. Find the distinct concepts or workflows and give each a cohesive module with a name that describes what it owns. Do not move unrelated leftovers into a generic utility module or split one responsibility into numbered fragments merely to cross the threshold. The default limit is 250, configured with `max-source-file-lines` in `[tool.repostyle]`."
examples = []
signals = ["The module owns distinct concepts or workflows: split them along those responsibility boundaries.", "The module is one cohesive responsibility with substantial data or declarations: keep the structure readable and use a targeted waiver when a split would obscure ownership.", "The module must stay intact for a documented reason: place `# style: ignore-file[RS066]` near the top with a short rationale."]
reference = []
