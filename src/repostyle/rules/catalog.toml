[RS032]
name = "return-described-in-prose"
summary = "The return value goes in a `Returns:` section, not narrated in the docstring body."
rationale = "A reader and a documentation tool both look for the return contract under a `Returns:` or `Yields:` caption, so a body paragraph that carries it instead hides it. The rule reads the phrasing, not the verb, so recasting the sentence does not satisfy it -- move the description into a section. The summary line is exempt: it states the contract rather than narrating it, and a one-line summary is often all a scalar return needs."
examples = [{ bad = "A file of any other type yields nothing.", good = "Returns:\n    Each comment, and nothing for another type.", note = "The phrasing does not matter; the section it belongs under does." }]
signals = ["A body sentence led by a return verb (`Returns the lease.`, `Yields each row.`): move it under `Returns:` or `Yields:`.", "A body sentence whose subject is the returned thing (`The result is ...`, `The return value is ...`): same move.", "A return verb mid-sentence under an input or condition subject (`A malformed file returns None.`): same move."]
reference = []

[RS033]
name = "filename-convention"
summary = "A non-Python file uses the configured preferred extension and casing (default: `.yaml` over `.yml`, kebab-case)."
rationale = "yaml.org has recommended `.yaml` since 2006; `.yml` only persists from the old DOS/Windows 8.3 filename-length limit. Google's developer documentation style guide prefers hyphens over underscores in filenames, since a search engine reads a hyphen as a word break but not an underscore. Both defaults are configurable -- `[tool.repostyle.filename-extensions]` replaces the extension map wholesale, `filename-case` takes `snake` or `none`. A curated set of tool- or ecosystem-mandated fixed names (`README.md`, `CHANGELOG.md`, `LICENSE`, `CODEOWNERS`, `CLAUDE.md`, ...) is exempt from both checks by default, so a repo never re-lists them; `filename-ignore` extends that set with any further fixed-name file a tool mandates rather than renaming it. An extensionless name like `Dockerfile` or `LICENSE` only reaches this rule if the consuming repo's own pre-commit hook is configured to pass it -- the shipped hook and a bare directory argument both discover only `.py`/`.toml`/`.yaml`/`.yml`/`.md`."
examples = [{ bad = "config.yml", good = "config.yaml", note = "The default `filename-extensions` mapping." }, { bad = "my_config.yaml", good = "my-config.yaml", note = "The default `filename-case` of kebab." }]
signals = []
reference = []

[RS034]
name = "imperative-docstring-opening"
summary = "A docstring summary opens descriptively (`Returns the lease.`), not imperatively (`Return the lease.`)."
rationale = "The house convention states a unit's contract in descriptive third person, matching Google's own style guide rather than PEP 257's imperative recommendation. The check matches a fixed set of common bare-infinitive openings adapted from pydocstyle's own word list (the data behind ruff's D401, which enforces the opposite convention), so it is advisory in both directions: an opening verb outside that set is not flagged, and a verb that commonly doubles as a noun (`Check`, `Report`, `Format`, `Handle`, `Set`, ...) still stays in the set because pydocstyle's own data accepts that risk wholesale, reinforced for several of these by a survey of real gradienthealth repos that found a genuine imperative opening for each and no noun-phrase false positive; the occasional false positive (`Check constraint enforced on the age column.`) is an accepted cost. `Route` carries the same risk on that survey's evidence alone, since it is not itself a pydocstyle entry. A handful of pydocstyle's own entries (`List`, `Query`, `Test`, ...) are left out anyway because the noun reading dominates in this codebase's own domain. A consuming repo tunes the set for its own domain via `imperative-verbs-extra`/`imperative-verbs-exclude` in `[tool.repostyle]`, rather than editing the shared verb list every repo inherits."
examples = [{ bad = "\"\"\"Return the lease held by `client_id`.\"\"\"", good = "\"\"\"Returns the lease held by `client_id`.\"\"\"", note = "Conjugate the opening verb to third-person singular." }]
signals = []
reference = ["Access -> Accesses", "Apply -> Applies", "Copy -> Copies", "Dispatch -> Dispatches", "Do -> Does", "Empty -> Empties", "Establish -> Establishes", "Fetch -> Fetches", "Finish -> Finishes", "Fix -> Fixes", "Go -> Goes", "Hash -> Hashes", "Have -> Has", "Identify -> Identifies", "Launch -> Launches", "Modify -> Modifies", "Pass -> Passes", "Publish -> Publishes", "Refresh -> Refreshes", "Reply -> Replies", "Search -> Searches", "Specify -> Specifies", "Try -> Tries", "Verify -> Verifies"]

[RS035]
name = "doc-summary-overflow"
summary = "A docstring summary line fills within 79 columns."
rationale = "PEP 257 and Google style require a docstring summary to be exactly one physical line, so unlike a body paragraph it has no second line to spread overflow onto -- `doc-fill`'s `--fix` cannot rewrap it, only shrink or relocate the words by hand. Move a detail that does not fit into the body or an `Args:`/`Returns:` section instead of letting the summary run long."
examples = [{ bad = "\"\"\"Builds the outbound claim payload from the encounter, the coverage, and the billing provider.\"\"\"", good = "\"\"\"Builds the outbound claim payload.\n\n    Builds the payload from the encounter, the coverage, and\n    the billing provider.\n    \"\"\"", note = "Keep the summary to one short line and move the rest into a body paragraph, which `doc-fill` can wrap." }]
signals = []
reference = []

[RS036]
name = "unbackticked-code-reference"
summary = "A docstring wraps a code name it references -- a parameter, an import, a class, `None`/`True`/`False` -- in single backticks."
rationale = "The house style sets a code token in single backticks so prose reads apart from the identifiers it names. A linter cannot decide this for an arbitrary word, so the check stays mechanical by firing only where two signals agree: the word matches a name the module itself binds (a parameter, import, function, class, or accessed attribute) or a literal constant, and its shape rules out plain English -- an underscore, a digit, or an interior capital beside a lowercase letter (`skip_lines`, `HttpClient`). A literal (`None`/`True`/`False`) fires mid-sentence but not at a sentence start, where its capital could open an English clause. A plain-lowercase name (a `path` parameter) and a Titlecase or all-caps word that also reads as English (`Path`, `WARNING`) are left to review, since no rule can tell the reference from the word. Grounding the match in the module's own names is what lets a code-shaped word the module never binds -- a proper noun, or a name shown only in an example -- pass untouched: the shape marks a candidate, but only a name the code defines fires."
examples = [{ bad = "\"\"\"Returns None when skip_lines is empty.\"\"\"", good = "\"\"\"Returns `None` when `skip_lines` is empty.\"\"\"", note = "Backtick a literal and a code-shaped parameter; a plain word like `path` stays for review to judge." }]
signals = []
reference = []

[RS037]
name = "glued-code-span"
summary = "Prose ends a code span on a word boundary; no suffix is glued to the closing backtick."
rationale = "A code span sets a name in code font, so a suffix run straight onto its closing backtick -- a possessive, a plural, or a verb ending -- reads as part of the identifier and breaks the span in rendered Markdown. Moving the suffix outside the span keeps the prose readable and the identifier exact. The check stays mechanical: it fires on a closing backtick followed by a letter or an apostrophe, and leaves a hyphenated compound (`-typed`, `-safe`) alone, since that still ends the span on a word boundary."
examples = [{ bad = "\"\"\"Returns the `Observation`s in the bundle.\"\"\"", good = "\"\"\"Returns the `Observation` resources in the bundle.\"\"\"", note = "A possessive glues the same way: write the value of `patient.identifier`, not `patient.identifier`'s value." }]
signals = []
reference = []

[RS038]
name = "tag-comment-continuation-indent"
summary = "A wrapped tag comment indents its continuation past the tag; a separate note is set off by a blank line."
rationale = "A `TODO(TICKET): ...` comment that wraps onto a further line reads as one unit only when the wrapped text is indented past the tag. A flush follow-on line is ambiguous: it could be the wrap or an unrelated comment. The convention resolves it by column -- a continuation is indented, an independent comment is set off by a blank line. A follow-on line that is itself a tag comment is a new tag, not a wrap, and is left alone. The check spans Python, TOML, YAML, and shell comments."
examples = [{ bad = "# TODO(PROC-1234): rework the retry path\n# once the client exposes a deadline", good = "# TODO(PROC-1234): rework the retry path\n#     once the client exposes a deadline", note = "A blank line instead makes the second line its own comment." }]
signals = []
reference = []

[RS039]
name = "unbackticked-sibling-symbol"
summary = "When a docstring or comment block backticks one code symbol, its sibling code tokens in the same block are backticked too."
rationale = "Once a docstring or comment block sets one code symbol in single backticks, leaving a sibling token bare reads as an oversight, not a choice, so the house style asks for the whole block to be consistent. This check fires only on that inconsistency, which keeps it mechanical: a block must already backtick at least one code-shaped token before a bare token in it is weighed. A bare token qualifies only when its shape rules out plain English -- an underscore, a digit, or an interior capital beside a lowercase letter -- and when the same file carries it verbatim inside a string literal, such as a table or column name in an embedded SQL statement, which is self-contained proof it names a real identifier. A name the module binds is left to RS036, which fires on it whether or not a sibling is backticked, so the two rules never flag one token. Only Python is scanned, since the string-literal proof is read from the file's own AST."
examples = [{ bad = "\"\"\"`ContinuousDiscoverySettings` rejects a value, so a remote_aes row fails to load.\"\"\"", good = "\"\"\"`ContinuousDiscoverySettings` rejects a value, so a `remote_aes` row fails to load.\"\"\"", note = "`remote_aes` also appears in a SQL string elsewhere in the file, so its bare mention beside the backticked `ContinuousDiscoverySettings` is flagged." }]
signals = []
reference = []

[RS040]
name = "deeply-nested-type"
summary = "A type annotation nests subscripted generics past two levels; name the buried type."
rationale = "A generic nested two deep inside others packs a data structure into a signature the reader re-parses at every use, and the deeper it goes the more it hides what the value actually models. Past two levels the annotation is usually standing in for a type that wants a name. A two-level `Iterator[tuple[...]]` or `dict[str, list[...]]` is idiomatic and left alone; every subscript layer beyond that counts the same -- a `tuple` or a `Callable` is no easier to read nested -- so the remedy is to give the inner shape a name, not to reformat the annotation. Reach for the construct that fits what the shape is: a `TypeAlias` when it is genuinely just an alias, a `NamedTuple` or dataclass when the fields deserve names."
examples = [{ bad = "def group(rows: list[tuple[str, list[Record]]]) -> None: ...", good = "KeyedRecords: TypeAlias = tuple[str, list[Record]]\ndef group(rows: list[KeyedRecords]) -> None: ...", note = "Naming the inner `tuple[str, list[Record]]` drops the annotation to one level and states what it holds." }]
signals = []
reference = []

