[RS012]
name = "cognitive-complexity"
summary = "A function's cognitive complexity is over the limit of 15."
rationale = "Cognitive complexity weights control flow by nesting depth, so the remedy is rarely to shorten the function -- it is to flatten or factor the structure driving the score. Reach for the remedy that matches the cause, not a blanket extraction."
examples = []
signals = ["Deep nesting (an `if` inside a `for` inside an `if`): invert the condition and `return` or `continue` early to peel off a level, or extract the inner block into its own function.", "Many sibling branches (a long `if`/`elif` chain): replace it with a dispatch table or a mapping keyed by the discriminant.", "Long boolean chains (`a and b or c and d`): extract the condition into a named predicate whose name states what it tests."]
reference = []

