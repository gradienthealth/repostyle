[RS060]
name = "file-literal-restatement"
summary = "A test asserts only literals it read from a single repo file."
rationale = "A test that parses one file, compares what it finds to literals, and exercises nothing beyond the parser restates that file: the edit that changes the value changes the assertion beside it, and no rewrite preserving the behavior a caller relies on can break it. Such a test costs a second edit site and reads as coverage without supplying any. Two fixes work. Where the property is executable -- a container starts, a script runs, a config loads -- assert it where it executes, since that survives a rewrite of the file. Where the value has to agree with a second file, read both and assert they match, which catches the one-sided edit no single diff shows."
examples = [{ bad = "compose = yaml.safe_load(_COMPOSE_PATH.read_text())\nassert compose[\"services\"][\"drain\"][\"user\"] == \"1000:1000\"", good = "compose = yaml.safe_load(_COMPOSE_PATH.read_text())\ndeclared = _DOCKERFILE_PATH.read_text()\nassert compose[\"services\"][\"drain\"][\"user\"].split(\":\")[0] in declared", note = "The uid has to match the one the image declares, so read both files rather than quoting the number twice." }]
signals = ["The rule stays silent on a test that reads two or more files, one comparing a derived value to another derived value, one asserting across every entry it read, and one whose fixture no module in scope defines. Fixtures resolve through the requesting class, the test module, and each `conftest.py` above it; what pytest supplies from outside that chain is unknowable, so the rule declines to guess. A `@pytest.mark.parametrize` argument reads as one of those undefined fixtures, so a parametrized test goes unexamined.", "A deliberate single-file pin -- a value with no second home and no executable surface -- takes `# style: ignore[RS060]` with the reason it cannot be checked anywhere better."]
reference = []

[RS061]
name = "double-space-after-period"
summary = "Prose uses a single space after sentence-ending punctuation (`.`, `!`, `?`), not the old typewriter double space; comments are checked in Python, TOML, YAML, and shell."
