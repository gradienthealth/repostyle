[RS015]
name = "excessive-mocking"
summary = "A test builds more than three mocks, a density signal of brittle coupling."
rationale = "A test can require many mocks for legitimate reasons, so this rule marks a review site instead of a defect. Check whether the unit crosses unnecessary collaborators or whether a fake could expose caller-visible behavior. Keep the test when each collaborator is essential. Do not redistribute mock construction merely to cross the threshold."
examples = []
signals = ["Replace a mock of your own collaborator with a port fake under `tests/fakes/` that records and replays observable interactions.", "If the unit needs many mocks to stand up, it may have too many dependencies -- consider whether it is doing too much.", "A mock that only satisfies a constructor argument can often be a real lightweight value or a shared fixture."]
reference = []

[RS016]
name = "behavior-verification-only"
summary = "A test asserts only call choreography (`assert_called*`), never state."
rationale = "Call-only assertions bind a test to collaborator choreography. They can pass when a defect preserves the calls and fail when a correct rewrite changes them. Prefer an observable result or a fake. Delete the test when no stable behavior is available. Do not add an unrelated assertion merely to clear the warning."
examples = [{ bad = "repository.save(patient)\nrepository.save.assert_called_once_with(patient)", good = "repository.save(patient)\nassert repository.stored == [patient]", note = "Assert the fake's recorded state, not that a method was called." }]
signals = []
reference = []

[RS017]
name = "banned-import-by-path"
summary = "A file imports a module its layer's `banned-imports` config forbids."
rationale = "The bans express the repo's layering boundaries -- an inner domain or port module must not import an outer adapter or the CLI, so the dependency arrow points inward. The fix is not to delete the import but to move the code that needs it to the layer that may hold it, or to invert the dependency behind a port the inner layer owns. The banned sources are configured per glob in `[tool.repostyle.banned-imports]`; read that table for which layer owns what."
examples = [{ bad = "# in src/domain/ports/clock.py\nfrom myrepo.adapters.system_clock import now", good = "# the port declares the contract; an adapter implements it\nclass Clock(Protocol):\n    def now(self) -> datetime: ...", note = "Depend on an abstraction the inner layer owns; let the outer layer provide the concrete import." }]
signals = []
reference = []

