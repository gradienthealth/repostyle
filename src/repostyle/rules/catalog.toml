[RS009]
name = "doc-fill"
summary = "A docstring, comment, or YAML folded-scalar paragraph fills to 79 columns."
rationale = "A paragraph wrapped well short of the limit, or running past it, reads as ragged and churns diffs when reflowed by hand. Fill each prose paragraph to 79 columns. Only prose is filled: a preformatted line -- one ending in a `\\` continuation, or holding an interior run of spaces that aligns a column -- is verbatim, since a reflow emits single-spaced text and would corrupt it. Docstrings are checked in Python; comments in Python, TOML, YAML, and shell alike. YAML prose is checked too, inside a folded (`>`) block scalar that closes on a `.`, `!`, or `?`: its line breaks fold to spaces, so a rewrap leaves the value alone, and the closing punctuation separates prose from the `>` blocks that merely wrap a long expression. A literal (`|`) scalar keeps its breaks as content and is never touched. A folded scalar that closes on anything else goes unchecked, and no rule covers it: RS030 reads `#` comments alone. Close the prose with a period and RS009 applies. `--fix` rewrites every language it reads."
examples = []
signals = []
reference = []

[RS010]
name = "banned-abbreviation"
summary = "Spell names out; a known abbreviation in an introduced name is rejected."
rationale = "An abbreviation saves a few characters at the cost of a reader expanding it, and the expansions disagree across a codebase (`req` for request, requirement, or required). Spelling the word out keeps names searchable and unambiguous. The abbreviation is matched as a whole word in a snake_case or CapWords name, so an attribute access or a string literal is left alone."
examples = [{ bad = "def handle(req, resp): ...", good = "def handle(request, response): ...", note = "Fix every abbreviation in the file, not just the flagged one -- the reference below is the full banned set." }]
signals = []
reference = ["btn -> button", "cfg -> configuration", "conn -> connection", "ctx -> context", "idx -> index", "mgr -> manager", "mngr -> manager", "req -> request", "res -> result", "resp -> response", "usr -> user"]

