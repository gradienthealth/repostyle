[RS059]
name = "duplicate-docstring-section"
summary = "A docstring holds at most one section per family; a second `Args:` (or an `Args:` after an `Arguments:`) merges into the first."
rationale = "A duplicated section splits one kind of content across two places, so a reader stops at the first block and misses the rest. The duplicate is flagged at its own header; move its entries into the first block and delete it. Aliases count as one family, so an `Args:` after an `Arguments:` is a duplicate, as is a `Notes:` after a `Note:`. Not auto-fixable: merging two blocks can collide on an entry documented twice, which needs a human reading."
examples = []
signals = []
