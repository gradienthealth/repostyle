[RS042]
name = "eq-hash-pairing"
summary = "A class defines `__eq__` and `__hash__` as a pair, or neither."
rationale = "Overriding `__eq__` without `__hash__` makes instances silently unhashable, since Python sets the class's `__hash__` to `None`; defining `__hash__` without `__eq__` keeps a value hash beside identity equality. Define both so equality and hashing agree, or set `__hash__ = None` to opt out of hashing on purpose. A `@dataclass` or `attrs` class synthesizes both and is exempt, as is a class inheriting the other half from a non-`object` base. The eq-without-hash half stands in for ruff's `PLW1641`, which is preview-gated in the pinned ruff version; when it graduates to stable, select it in `ruff-base.toml` and drop that half here."
examples = [{ bad = "class Money:\n    def __eq__(self, other): ...", good = "class Money:\n    def __eq__(self, other): ...\n    def __hash__(self): ...", note = "Or make it a `@dataclass`, which synthesizes both from its `eq=`/`frozen=` flags." }]
signals = []
reference = []

[RS043]
name = "raises-section-incomplete"
summary = "A `Raises:` section lists every exception the body raises outright."
rationale = "Once a function documents its exceptions in a `Raises:` section, a reader trusts the section to be complete, so an exception the body raises with an explicit `raise SomeError(...)` but the section omits silently understates the contract. A function with no `Raises:` section does not fire -- whether to document exceptions at all is the prose-side choice RS041 governs. Where an exception is both raised in code and narrated in unstructured docstring prose, RS041 owns it and this rule stays silent."
examples = []
signals = []
reference = []

[RS044]
name = "predicate-function-naming"
summary = "A `-> bool` function named as a bare state word reads as a yes/no question (`is_valid`, not `valid`)."
rationale = "A boolean function should read as the question its call site asks, so a single bare adjective or state noun (`valid`, `ready`, `enabled`) takes a predicate prefix (`is_`/`has_`/`can_`/`should_`). The check is deliberately narrow to stay near zero-false-positive: it fires only on a single-word name, since a multi-word name already carries a predicate somewhere (`field_has_docstring`), and it accepts a third-person verb (`matches`, `suppresses`), the idiomatic predicate-verb name a `-> bool` function may take. A dunder, a property setter, and an `@override`/`@overload` are exempt."
examples = [{ bad = "def valid(self) -> bool: ...", good = "def is_valid(self) -> bool: ...", note = "A predicate verb (`matches`, `exists`) needs no prefix." }]
signals = []
reference = []

[RS045]
name = "temporal-marker"
summary = "A docstring or comment states the code's present contract, not a temporal or edit-narrative marker of how it changed."
rationale = "A durable docstring or comment describes what the code does now. A marker like `previously`, `used to`, `formerly`, `originally`, `as discussed`, `we decided`, `for now`, `changed to`, or `switched to` narrates the edit or the design discussion instead -- the story belongs in the commit message, where it stays attached to the diff, not in prose a later reader mistakes for the current contract. This is the common shape of an agent leaking the session's design chat into the code. The set is held deliberately tight (ambiguous words like `currently`, `instead of`, or `note that` are left out) and a marker quoted in a backtick span is read as data, not narration, so the rule stays a mechanical floor. The judgment ceiling -- prose that narrates the edit without one of these exact markers -- is left to review. Not auto-fixable: cutting the narration cleanly needs judgment, so no `--fix`."
examples = [{ bad = "\"\"\"Returns the lease. Previously returned a raw dict.\"\"\"", good = "\"\"\"Returns the lease.\"\"\"", note = "Drop the note on the old shape; the diff already records it." }, { bad = "# we decided to cache this for now", good = "# cached because the upstream call dominates the request time", note = "Replace the decision narration with the durable reason the code is the way it is, or delete the comment." }]
signals = []
reference = []

[RS046]
name = "range-len-reindex"
summary = "A `for i in range(len(seq))` that only indexes `seq[i]` should iterate `seq` directly."
rationale = "Looping over `range(len(seq))` to read `seq[i]` at each step spends an index variable on what `for item in seq:` says directly, and the indirection hides that the loop is a plain traversal. The check fires only when the index is used for nothing but subscripting that same sequence, so a loop that also needs the index -- for arithmetic, a second sequence, or a call -- is left alone rather than steered toward `enumerate`, the weaker suggestion this rule deliberately does not make. No stable ruff rule expresses this: pylint's `C0200` (`consider-using-enumerate`) covers the shape but is not ported to ruff's rule set, so it stays a genuine gap this rule fills."
examples = [{ bad = "for i in range(len(rows)):\n    process(rows[i])", good = "for row in rows:\n    process(row)", note = "When the index is needed too -- `rows[i]` beside `i + 1` or a bare `i` -- the loop is left alone." }]
signals = []
reference = []

[RS047]
name = "lowercase-entry-description"
summary = "An `Args:`/`Returns:`/`Raises:`/`Yields:` entry description opens with a capital letter (`bar: A bar.`, not `bar: a bar.`)."
rationale = "The house treats each Google-section entry description as a full sentence, so it opens with a capital just as RS030 requires it to close with a period -- the two rules are the opening-capital and closing-period halves of one convention. ChromiumOS's Python style guide requires docstring content, including argument descriptions, to be full sentences with proper capitalization and punctuation, and Google's own `Args:` examples are capitalized. No ruff or pydocstyle rule enforces entry-description capitalization, so it is a genuine gap. The check stays near zero-false-positive: only a lowercase ASCII prose letter fires, and a description opening with a backtick code span, an inherently-lowercase code token (a parameter name or a dotted path like `json.dumps`), a digit, or any other non-letter is left alone."
examples = [{ bad = "Args:\n    bar: a bar.", good = "Args:\n    bar: A bar.", note = "" }, { bad = "Raises:\n    NotFoundError: if a foo is not found.", good = "Raises:\n    NotFoundError: If a foo is not found.", note = "" }]
signals = []
reference = []

[RS048]
name = "private-import"
summary = "A first-party import consumes another package's public surface, not its `_`-private internals."
rationale = "A single leading underscore marks a module or name internal to the package that holds it, so reaching it from outside that package relies on an implementation detail the author did not publish. The supported way to use another package is the surface it re-exports from its `__init__`; if a member is needed there, it should be lifted onto that surface, not reached past. This is the dual of RS029: RS029 asks a package to hide what only it uses, this asks other code not to reach into what was hidden. The check scopes to imports that share the importer's top-level package, so it governs a repo's own layering and leaves a reach into a third-party distribution -- whose internals a repo cannot restructure -- alone. It follows PEP 8's `Public and internal interfaces`: an interface is internal if any containing namespace is, and other modules must not rely on indirect access to it except through a package's documented `__init__`. A test module is exempt, since exercising a unit under test's internals is expected."
examples = [{ bad = "# in myapp/api/views.py\nfrom myapp.core._engine import run", good = "# in myapp/api/views.py\nfrom myapp.core import run", note = "`_engine` is internal to `myapp.core`, and `views` lives outside `core`, so it must go through `core`'s public surface. Re-export `run` from `core/__init__.py` rather than reaching past it. An import from within `myapp.core` itself is fine." }]
signals = []
reference = []

[RS049]
name = "acronym-casing-in-prose"
summary = "A known acronym in docstring or comment prose is written in its canonical casing (`IPv6`, not `ipv6`; `NAT`, not `Nat`)."
rationale = "RS001 holds an acronym to its canonical casing in a CapWords identifier; this holds the same acronym to the same casing in the prose beside it, where a miscased `ipv6` or `Nat` reads as an ordinary word. The canonical casing is not always uppercase -- `IPv6` is mixed-case -- so each acronym carries its own target casing, and `--fix` recases an occurrence in place. The resolved set shares RS001's `acronyms-extra`/`acronyms-exclude` config keys. The check stays mechanical by firing only on a whole-word token, so a substring (`ID` in `identify`, `NAT` in `nation`), a hyphenated compound (`fhir-ingestor`, a proper name whose lowercase is correct), and a dotted name (`baseline.json`, `json.loads`) are left alone, as is a token inside a backtick span or a URL, a commented-out statement, and an `Args:` entry's parameter caption. An acronym whose lowercased form is a common English word (`SMART` to `smart`) is dropped from prose to avoid rewriting the word, though a repo can reintroduce it through `acronyms-extra`. Ruff has no acronym-casing-in-prose check, so this is a genuine gap."
examples = [{ bad = "\"\"\"Parses the ipv6 address the Nat gateway advertises.\"\"\"", good = "\"\"\"Parses the IPv6 address the NAT gateway advertises.\"\"\"", note = "The canonical casing is per-acronym: `IPv6` mixed, `NAT` upper." }]
signals = []
reference = []

[RS050]
name = "disfavored-gcp-term"
summary = "A disfavored Google Cloud product or brand name in docstring or comment prose is written in its current form (`Cloud Storage`, not `GCS`; `Google Cloud`, not `GCP`)."
rationale = "Google retired `GCP` and `Google Cloud Platform` as the umbrella brand (circa 2022) in favor of `Google Cloud`, and each product has one canonical name (`Cloud Storage`, `Compute Engine`, `Pub/Sub`), so prose that mixes the old shorthand with the current name reads as two systems. The map is curated and matched only as a whole word, so a substring (`GCS` in `GCSError`), a term glued to a hyphen, and a dotted name (`gcs.upload`) are left alone; a term in code font (the identifier `gcp.storage`), inside a URL, or in an `Args:` parameter caption is blanked before the scan and likewise skipped, and `--fix` rewrites the rest in place. Only unambiguous substitutions are mapped; a bare `Storage` or `Monitoring` is too often an ordinary English word to rewrite mechanically, so it is left to review. Ruff has no equivalent, and codespell catches misspellings, not brand-name substitutions."
examples = [{ bad = "\"\"\"Uploads the study to a GCS bucket in GCP.\"\"\"", good = "\"\"\"Uploads the study to a Cloud Storage bucket in Google Cloud.\"\"\"", note = "Fix every disfavored term in the file; the reference is the full map." }]
signals = []
reference = ["Big Query -> BigQuery", "Big Table -> Bigtable", "BigTable -> Bigtable", "GCE -> Compute Engine", "GCP -> Google Cloud", "GCS -> Cloud Storage", "Google Cloud Platform -> Google Cloud", "Pub Sub -> Pub/Sub", "PubSub -> Pub/Sub"]

[RS051]
name = "gcp-bare-identifier"
summary = "A string-typed parameter named for a Google Cloud resource collection (`project`, `bucket`, ...) carries the `_id` suffix."
rationale = "Google's resource-oriented design distinguishes a resource's bare id (`my-bucket`) from its qualified `{collection}/{id}` name. A `str` parameter named for the collection alone almost always holds the id, and the `_id` suffix says so, so a caller reads the intent without tracing the value; it also matches the `project_id` the code should pass to a Pulumi `project=` argument, rather than the bare `project` that Pulumi's own signature uses. The check fires only on a string annotation, so a resource object or an `Output` named `project` is left alone, and only on an exact-match name, so `project_id` and `bucket_url` are not touched. It reaches only this unambiguous subset; whether a `*_name` holds a bare id, a path, or a Pulumi logical handle is dataflow-dependent and stays with review (`docs/gcp-naming.md`). A repo with no Google Cloud resources drops the rule via `ignore`."
examples = [{ bad = "def grant_viewer(project: str, bucket: str) -> None: ...", good = "def grant_viewer(project_id: str, bucket_id: str) -> None: ...", note = "Only a `str`-typed, exact collection-noun parameter is flagged." }]
signals = []
reference = ["bucket -> bucket_id", "dataset -> dataset_id", "instance -> instance_id", "project -> project_id", "subscription -> subscription_id", "topic -> topic_id"]

[RS052]
name = "over-broad-except"
summary = "An `except` tuple does not reach past the failure it was written for, into the structural builtins."
rationale = "`AttributeError`, `TypeError`, `KeyError`, `IndexError`, `NameError`, and `UnboundLocalError` each say a value was not the shape the code assumed, which is what a bug looks like from the outside. A handler that takes in two of them at once, or one of them beside a declared exception -- any name the builtins do not define, whether from the stdlib, a third-party package, or this project -- cannot tell the failure it was written for from a typo in the same block, and that declared exception is already the callee's error contract, so the builtins beside it are covering something else. The fix is almost never in the handler: shrink a `try` that covers more statements than the handler was written for, so what raises the builtins sits outside it, or convert the failure where it arises so the callee raises one named error. Left alone are a handler ending in a `raise`, since a boundary converting what it caught into one named failure is the fix rather than the smell; a single structural builtin, which is routinely deliberate; and the value-and-environment errors (`ValueError`, `OSError`, and their kin) that report something the code handled correctly and does not control. ruff's `BLE001` covers only a bare `except Exception`, so a tuple of concrete builtins is a genuine gap."
examples = [{ bad = "try:\n    return has_uncompressed_length(dataset)\nexcept (PayloadError, AttributeError, TypeError, KeyError):\n    return False", good = "try:\n    return has_uncompressed_length(dataset)\nexcept PayloadError:\n    return False", note = "The builtins came from `int(dataset.Rows)` inside the callee. Reading that attribute through a helper that raises `PayloadError` leaves the handler one type wide." }, { bad = "except (KeyError, TypeError):\n    return None", good = "except (KeyError, TypeError) as exc:\n    raise ParseError('response missing a field') from exc", note = "The second remedy, for where the callee cannot be changed: a handler whose last statement is a `raise` is a boundary converting a wide failure into one named error, so it is exempt and the callers above it catch only `ParseError`. Raising on one branch and falling through on another still swallows, so only the closing statement counts." }]
signals = []
reference = ["AttributeError", "IndexError", "KeyError", "NameError", "TypeError", "UnboundLocalError"]

[RS053]
name = "bullet-item-casing"
summary = "A bulleted list holding a multi-sentence item opens every item with a capital letter."
rationale = "A list item running more than one sentence is prose, and prose opens with a capital; once one item in a list is such prose, a lowercase sibling makes the list read in two registers at once. The rule therefore asks for consistency per list: a list with any multi-sentence item is sentence-cased throughout, while a list whose items are all single-sentence fragments may stay lowercase, since a fragment continues the sentence that introduced the list. This is RS047's opening-capital convention carried to bulleted lists, and like RS047 it exempts an item opening with a backtick span, a dotted path, a distinctive-shaped identifier, a digit, or any other non-letter. Not auto-fixable: capitalizing a leading word that is really a lowercase code name would corrupt it, so the opener is left to review."
examples = [{ bad = "- the thing. Does a foo.\n- the other thing", good = "- The thing. Does a foo.\n- The other thing.", note = "The first item runs two sentences, so the whole list is sentence-cased. A list of one-sentence fragments (`- the thing`) may stay lowercase." }]
signals = []
reference = []

[RS054]
name = "nonstandard-dash"
summary = "Docstring and comment prose sets a clause off with the house sentence dash, the spaced `--`, not an em dash, en dash, or single hyphen."
rationale = "Prose reaches for a sentence dash in several shapes -- an em dash, spaced or glued, an en dash, a spaced single hyphen, a glued double hyphen -- and each writer picks one by local precedent, so files drift apart. The house standardizes on the spaced double hyphen: it is unambiguous ASCII (an em dash, an en dash, and a hyphen-minus render nearly alike in many editors, so drift among them is invisible), it cannot be mistaken for a bullet marker or a minus sign, and it greps trivially. The check masks backtick spans and URLs, leaves an unspaced en-dash range (`RS013–RS016`) alone, and requires letters around a hyphen form, so arithmetic, negative numbers, CLI flags, and bullet markers never fire. Auto-fixable: `--fix` rewrites each flagged dash to the spaced `--`."
examples = [{ bad = "# resolves the config -- falling back to defaults", good = "# resolves the config -- falling back to defaults", note = "" }, { bad = "\"\"\"Returns the lease - or `None` when expired.\"\"\"", good = "\"\"\"Returns the lease -- or `None` when expired.\"\"\"", note = "A spaced single hyphen between letters is doing dash work; `3 - 5` and `n - 1` are left alone." }]
signals = []
reference = []

[RS055]
name = "banner-comment"
summary = "No banner, section-divider, or framed-title comments: the rule characters go and the grouping is expressed with structure."
rationale = "A banner -- a lone `# -----` divider, the frame lines boxing a `# TESTS` title, or a one-line `# --- main ---` -- decorates a grouping instead of expressing it, and a file reaching for visual section markers is reporting that it wants higher-level modularization. Take the alternative that fits: split the module so each section is its own file, gather the section into a class (test functions under one section into a test class), or, where the file must stay whole, open the run with a sentence comment saying what it holds. Only the typography is banned -- `# Handlers for the BigQuery MCP tool.` is an ordinary comment and passes. The set is banned outright rather than held to one canonical shape because every author picks a different width, character, casing, and closing run, so the convention never converges. The check flags a comment whose text is wholly rule characters, or that a run of three or more opens or closes against whitespace; YAML's commented-out `# ---` document separator, the `+----+` ASCII-table border, PEP 263's `-*- coding: utf-8 -*-` line, an ASCII scissors (`---8<---`), and an arrow (`----->`) stay exempt. Not auto-fixable: deleting the divider is trivial, but the restructuring it points at is not."
examples = [{ bad = "# ----------------\n# HELPERS\n# ----------------\ndef _one(): ...", good = "def _one(): ...", note = "Delete the divider; a file that genuinely has sections wants a class or a module split, not typography." }, { bad = "# --- baseline ---\ndef test_baseline_returns_every_cohort(): ...\n\n# --- offset ---\ndef test_offset_skips_the_leading_cohorts(): ...", good = "class TestBaseline:\n    def test_returns_every_cohort(self): ...\n\n\nclass TestOffset:\n    def test_skips_the_leading_cohorts(self): ...", note = "A framed title is flagged whatever its width or casing. A test file dividing itself into sections is the commonest case, and a test class per section names the grouping in code." }, { bad = "# ========== BigQuery MCP ==========", good = "# Handlers for the BigQuery MCP tool.", note = "Where the module must stay whole, a sentence comment carries the same grouping without the typography." }]
signals = []
reference = []

[RS056]
name = "invalid-docstring-section"
summary = "A docstring section header comes from the recognized Google set -- `Args:`, `Returns:`, `Yields:`, `Raises:`, `Note:`, `Example:` -- not an invented or Sphinx-imported one."
rationale = "A header outside the recognized set -- `Warns:`, `Todo:`, `Design Notes:` -- hides its body from every rule that grades section content: RS030, RS041, RS043, and RS047 all read it as ordinary prose, and tooling walking the Google sections skips it. The check fires on a margin-level line of up to three capitalized words closing with a colon, with an indented body beneath it; a header-shaped line with no indented body reads as prose and is left alone. Not auto-fixable: where the body belongs -- folded into prose, or recast under `Raises:` or `Note:` -- depends on what it says."
examples = [{ bad = "\"\"\"Verifies the dataset.\n\n    Warns:\n        RangeWarning: If a decode exceeds the range.\n    \"\"\"", good = "\"\"\"Verifies the dataset.\n\n    Warns `RangeWarning` when a decode exceeds the\n    range.\n    \"\"\"", note = "`Warns:` renders under Sphinx's napoleon preset but is not in Google's own section set; state the warning in body prose (or a `Note:` section) instead." }]
signals = []
reference = []

[RS057]
name = "docstring-section-order"
summary = "Docstring sections follow the canonical Google order: `Args:`, then `Returns:` or `Yields:`, then `Raises:`, then `Example:`."
rationale = "The canonical order reads inputs, then outputs, then failures, then the example exercising them, so a reader lands on each section where every other docstring put it. The violation points at the section sitting below one that should follow it; the fix is to move the whole section block, body included. `Note:` and `Attributes:` hold no fixed slot and never fire."
examples = [{ bad = "Raises:\n    ValueError: If `x` is bad.\n\nReturns:\n    The lease.", good = "Returns:\n    The lease.\n\nRaises:\n    ValueError: If `x` is bad.", note = "" }]
signals = []
reference = []

[RS058]
name = "docstring-section-alias"
summary = "A section header uses the canonical Google spelling: `Args:`, not `Arguments:`; `Returns:`, not `Return:`; `Yields:`, not `Yield:`."
rationale = "The alias headers parse, so their bodies are still graded, but one spelling per corpus keeps a section greppable and the docstrings uniform. `Notes:` and `Examples:` are not aliases: singular versus plural there is the author's semantic choice. Auto-fixable: `--fix` rewrites each alias header to its canonical form in place."
examples = []
signals = []
