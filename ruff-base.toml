# Shared base ruff config for gradienthealth Python repos.
#
# Consuming repos extend this file from their own pyproject.toml:
#
#   [tool.ruff]
#   extend = "path/to/ruff-base.toml"
#
# then override only what they need (e.g. target-version, per-file
# ignores). Keep repo-specific knobs out of this file; it is the
# shared baseline every repo inherits.

line-length = 88

[format]
indent-style = "space"
quote-style = "double"

[lint]
# D100-D107 require docstrings on every module/class/function. The
# convention is no docstring over a low-content one (docstring
# minimalism). The remaining D rules still enforce shape and content
# when a docstring exists. D203/D213 are mutually exclusive with
# D211/D212. PT004 (leading-underscore on no-return fixtures) was
# removed upstream because the convention "isn't a practice
# recommended by the pytest community"; the broad PT select still
# pulls it in, so ignore explicitly.
ignore = [
    "E501",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "PT004",
]
# Complexity and size guardrails: C90 (cyclomatic, threshold in
# [lint.mccabe]) and the PLR caps on returns/branches/statements.
# PLC0415 (import-outside-top-level) bans in-function imports: an import
# inside a function body hides a dependency from the module header and is
# usually reflexive rather than a deliberate guard. A genuinely guarded
# import (heavy/optional/platform-specific) keeps its if/try guard at
# module top level.
# PLR0913 (too-many-arguments) is deliberately left out — it fires on
# many legitimate wide signatures, and is better adopted once
# enforcement is scoped to a PR's changed lines, not the whole tree.
select = [
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "C90",     # mccabe cyclomatic complexity
    "D",       # pydocstyle (Google convention)
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # isort
    "PLC0415", # import outside top-level (ban in-function imports)
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PT",      # flake8-pytest-style
    "RUF",     # ruff-specific
    "SIM",     # flake8-simplify
    "TID",     # flake8-tidy-imports (ban relative imports)
    "UP",      # pyupgrade
    "W",       # pycodestyle warnings
]
# D401 (non-imperative-mood summary) is disabled by the google
# convention's default ignore, so it must be re-enabled explicitly. It
# enforces the imperative one-line summary PEP 257 calls for ("Return
# the lease", not "Returns the lease"). A property whose summary
# legitimately reads as a noun phrase takes an inline `# noqa: D401`.
extend-select = ["D401"]

[lint.pycodestyle]
max-doc-length = 88

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "google"

[lint.flake8-tidy-imports]
ban-relative-imports = "all"
