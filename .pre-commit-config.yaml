repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
        name: ruff-linter
      - id: ruff-format
        name: ruff-formatter

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # CHANGELOG.md is generated by release-please in its own format (`*`
  # bullets); exclude it so mdformat and the style checker don't fight it.
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.19
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-tables
        args: [--compact-tables]
        exclude: ^CHANGELOG\.md$

  - repo: local
    hooks:
      - id: repostyle
        name: repostyle
        # Run the working-tree package off `src/` so a fresh checkout lints
        # without a prior `pip install -e .`, and every run reflects the rules
        # being edited. A `repo: local` python hook can't install this package
        # (it builds a placeholder in its own temp dir), so `language: system`
        # reaches the working tree instead; being stdlib-only, the ambient
        # `python3` (3.11+) needs nothing installed.
        entry: env PYTHONPATH=src python3 -m repostyle.cli
        language: system
        types_or: [python, markdown, toml, yaml]
        exclude: ^CHANGELOG\.md$
