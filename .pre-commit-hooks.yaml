# The `repostyle` hook runs the RSnnn linter; the `repostyle-*` gate hooks wrap
# third-party tools whose versions are pinned here, so a consumer bumps one
# repostyle rev to move the whole suite instead of tracking each tool's own
# hook repo. Each gate reads its own config from the consuming repo — a
# `[tool.*]` table in pyproject.toml for the Python gates, a `.shellcheckrc` or
# per-hook flags for the shell gates — so the repo-specific config stays local
# while the tool and its version live here.
- id: repostyle
  name: repostyle
  entry: repostyle
  language: python
  types_or: [python, markdown, toml, yaml, shell]

- id: repostyle-bandit
  name: bandit (via repostyle)
  description: Security lint of src/, reading [tool.bandit] from the repo.
  entry: bandit -c pyproject.toml -r src
  language: python
  additional_dependencies: ["bandit[toml]==1.9.4"]
  pass_filenames: false
  types: [python]

- id: repostyle-vulture
  name: vulture (via repostyle)
  description: Dead-code scan over the paths in [tool.vulture].
  entry: vulture
  language: python
  additional_dependencies: ["vulture==2.16"]
  pass_filenames: false
  types: [python]

- id: repostyle-deptry
  name: deptry (via repostyle)
  description: Dependency hygiene of src/, reading [tool.deptry] from the repo.
  entry: deptry src
  language: python
  additional_dependencies: ["deptry==0.25.1"]
  pass_filenames: false
  types: [python]

- id: repostyle-interrogate
  name: interrogate (via repostyle)
  description: Docstring-coverage floor, reading [tool.interrogate] from the repo.
  entry: interrogate --config=pyproject.toml
  language: python
  additional_dependencies: ["interrogate==1.7.0"]
  pass_filenames: false
  types: [python]

- id: repostyle-codespell
  name: codespell (via repostyle)
  description: Spell-check, reading [tool.codespell] from the repo.
  entry: codespell
  language: python
  additional_dependencies: ["codespell==2.4.2", "tomli"]
  types: [text]

- id: repostyle-shellcheck
  name: shellcheck (via repostyle)
  description: Static analysis of shell scripts, reading .shellcheckrc from the repo.
  entry: shellcheck
  language: python
  additional_dependencies: ["shellcheck-py==0.11.0.1"]
  types: [shell]

- id: repostyle-shfmt
  name: shfmt (via repostyle)
  description: Shell-script format check, failing on an unformatted file.
  entry: shfmt -d
  language: python
  additional_dependencies: ["shfmt-py==4.0.0"]
  types: [shell]
