name: sync judgment conventions

# docs/judgment-conventions.md is the org-wide judgment canon. Consumer repos
# vendor a read-only copy and import it from their CLAUDE.md so the conventions
# sit in a coding agent's context while it writes, not only at review. When the
# canon changes on main, mint a short-lived gradienthealth-bot token, copy the
# file into each consumer repo, and open a pull request. Edit the canon here,
# never the vendored copy — the next sync overwrites it.

on:
  push:
    branches:
      - main
    paths:
      - docs/judgment-conventions.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Consumer repos that vendor the canon. Add a repo here once it vendors
        # docs/judgment-conventions.md and imports it from its CLAUDE.md.
        repo:
          - fhir-ingestor
    steps:
      - name: Check out the canon source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Mint a gradienthealth-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "4149742" # gradienthealth-bot
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}

      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target

      - name: Copy the canon into ${{ matrix.repo }}
        run: cp source/docs/judgment-conventions.md target/docs/judgment-conventions.md

      - name: Open a sync pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: target
          branch: sync/judgment-conventions
          commit-message: "docs: sync judgment-conventions.md from pystyle"
          title: "docs: sync judgment-conventions.md from pystyle"
          body: |
            Automated sync of the judgment-conventions canon from gradienthealth/pystyle.
            This file is a read-only mirror — change it upstream in pystyle, not here.
          delete-branch: true
