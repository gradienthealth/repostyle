name: sync shared style files

# docs/judgment-conventions.md (the judgment canon), docs/gcp-naming.md (the
# Google Cloud naming convention), and ruff-base.toml (the shared ruff
# baseline) are org-wide style sources. Consumer repos vendor read-only copies
# — the docs imported from CLAUDE.md, ruff-base.toml extended from
# pyproject.toml — so each sits where a coding agent and the linter see it, not
# only at review. When any changes on main, mint a gradienthealth-bot token,
# copy them into each consumer repo, and open a pull request. Edit these here,
# never the vendored copies — the next sync overwrites them.

on:
  push:
    branches:
      - main
    paths:
      - docs/judgment-conventions.md
      - docs/gcp-naming.md
      - ruff-base.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Consumer repos that vendor these files, kept alphabetical. Add a repo
        # here once it vendors docs/judgment-conventions.md,
        # docs/gcp-naming.md, and ruff-base.toml.
        repo:
          - dicom-ingestor
          - fhir-ingestor
          - gradient-beam
          - gradient-pulumi-infrastructure
          - hl7-ingestor
          - trurez
    steps:
      - name: Check out the style sources
        uses: actions/checkout@v4
        with:
          path: source

      - name: Mint a gradienthealth-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "4149742" # gradienthealth-bot
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}

      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target

      - name: Copy the style sources into ${{ matrix.repo }}
        run: |
          cp source/docs/judgment-conventions.md target/docs/judgment-conventions.md
          cp source/docs/gcp-naming.md target/docs/gcp-naming.md
          cp source/ruff-base.toml target/ruff-base.toml

      - name: Open a sync pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: target
          branch: sync/repostyle-shared-style
          commit-message: "docs: sync shared style files from repostyle"
          title: "docs: sync shared style files from repostyle"
          body: |
            Automated sync of the shared style sources from gradienthealth/repostyle
            (judgment-conventions.md, gcp-naming.md, and ruff-base.toml). These are
            read-only mirrors — change them upstream in repostyle, not here.
          delete-branch: true
