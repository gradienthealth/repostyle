name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the floor (gradient-beam); 3.13 is the ceiling
        # (fhir-ingestor).
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # All checks run through pre-commit, so .pre-commit-config.yaml is the
  # single source of truth: ruff format/lint, the hygiene hooks,
  # mdformat, and the repostyle checker itself (dogfooding its own RSnnn
  # rules). Installing the package puts the repostyle console script on
  # PATH for its local hook.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
