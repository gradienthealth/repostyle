name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the floor (gradient-beam); 3.13 is the ceiling (fhir-ingestor).
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # ruff format/lint, the standard pre-commit hygiene hooks, and mdformat run
  # through pre-commit so the repo's own dev config (.pre-commit-config.yaml) is
  # the single source of truth, the same mechanism fhir-ingestor uses in CI.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The gradient-pystyle local hook invokes the installed console script.
      - run: pip install -e .
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  # Dogfood: run the checker over this repo's own sources so it stays
  # subject to the RSnnn rules it ships. 3.13 parses every construct,
  # including the PEP 695 syntax the acronym rule inspects.
  self-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: gradient-pystyle $(git ls-files '*.py' '*.md')
