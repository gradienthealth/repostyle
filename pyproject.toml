[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]

[project]
name = "gradient-pystyle"
description = "Shared repo-style lint rules for gradienthealth Python repos, plus a base ruff config."
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gradient-pystyle = "gradient_pystyle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
tag_regex = "^gradient-pystyle-v(?P<version>[0-9].*)$"
fallback_version = "0.0.0+local"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
