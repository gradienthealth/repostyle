[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
name = "repostyle"
description = "Shared repo-style lint rules for gradienthealth Python repos, plus a base ruff config."
readme = "README.md"
requires-python = ">=3.11"
# Managed by release-please from Conventional-Commit PR titles; do not edit by
# hand.
version = "0.12.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
# The house third-party lint gates, version-pinned so every consuming repo gets
# the same versions through one `repostyle[gates]` dependency rather than
# tracking each tool itself. A consumer installs this extra from the private
# index it already uses for repostyle, keeps its own `local` hooks, and reads
# each tool's `[tool.*]` table from its own pyproject. This is the package
# counterpart to the exported `repostyle-*` pre-commit hooks: same tools, same
# pinned versions, for a repo that consumes repostyle as a package over the
# index instead of cloning this private repo as a hook. mypy, pyright, and
# pip-audit are absent by design; they need the consuming repo's full
# environment, not repostyle's pinned set.
gates = [
    "bandit[toml]==1.9.4",
    "codespell==2.4.2",
    "deptry==0.25.1",
    "interrogate==1.7.0",
    "tomli",
    "vulture==2.16",
]

[project.scripts]
repostyle = "repostyle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.repostyle]
# CLAUDE.md is a fixed name Claude Code's tooling looks up exactly; renaming it
# risks the project instructions silently going unread on a case-sensitive
# filesystem. README.md and CHANGELOG.md keep the Unix/GNU and GitHub
# community-health-file convention of all-caps project metadata, which
# overrides RS033's general kebab-case default.
filename-ignore = ["CLAUDE.md", "README.md", "CHANGELOG.md"]
