[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
name = "pystyle"
description = "Shared repo-style lint rules for gradienthealth Python repos, plus a base ruff config."
readme = "README.md"
requires-python = ">=3.11"
# Managed by release-please from Conventional-Commit PR titles; do not edit by hand.
version = "0.2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pystyle = "pystyle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
